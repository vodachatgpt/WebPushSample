<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Push Demo — Admin</title><link rel="stylesheet" href="style.css"></head>
<body><main class="panel"><span class="eyebrow">WEB PUSH DEMO / ADMIN</span><h1>Broadcast notification</h1><p>Send a test push to all devices that previously granted permission and subscribed.</p><label>Demo admin key<input type="password" id="key" autocomplete="off" placeholder="Enter configured admin key"></label><label>Title<input id="title" maxlength="120" value="Hello from admin"></label><label>Message<textarea id="message" maxlength="500" rows="4">This message was sent from my .NET Framework Web API.</textarea></label><button id="send">Send to all subscribed devices</button><div class="status" id="result">Ready to send.</div><small>Push-service acceptance is not confirmation that the notification appeared. This demonstration uses a shared admin key; do not expose it publicly.</small></main><script src="admin.js"></script></body></html>
